openapi: 3.0.3

info:
  title: PayMix API
  description: |
    **PayMix** - 간편결제 시대의 카드 최적 배치 서비스 RESTful API 명세서

    카드사 내부 결제 데이터를 기반으로 고객의 실적·혜택·정기결제 현황을 진단하고,
    보유 중인 자사 카드를 어느 간편결제 채널에 배치해야 혜택이 최대가 되는지 제안한다.

    ## 액터별 API 구분
    | 액터 | 경로 접두사 | 설명 |
    |---|---|---|
    | 고객 | `/me/**` | 카드 연결, 진단 조회, 개선 제안 확인 |
    | 카드사 담당자 | `/issuer/**` | 채널 분석, 정책 시뮬레이션, 규칙 관리 |
    | 결제 승인계 (외부) | `/external/**` | 거래 데이터 송신 — 인터페이스만 정의, 구현 제외 |
    | 공통 | `/auth/**`, `/channels`, `/categories` | 인증 및 기준 정보 |

    ## 설계 원칙
    - 제안 범위는 **고객이 이미 보유한 자사 카드 내 재배치**로 한정한다. 타사 카드 비교나 신규 발급 유도는 범위 밖이다.
    - 모든 혜택 수치는 **서버 규칙 엔진**이 산출한다. AI 는 확정된 수치를 자연어로 설명하는 역할만 수행하며,
      `explanation` 필드가 이에 해당한다.
    - 제안 상세(`RecommendationDetail`)는 규칙 참조가 아니라 **계산 시점 스냅샷**(`snapshot*` 필드)으로 응답한다.

    ## 공통 규칙
    - 날짜/시간 형식: ISO 8601 (예: `2026-09-08T14:00:00`)
    - 기준월 형식: `YYYY-MM` (예: `2026-08`)
    - 금액 단위: 원(KRW), 정수
    - 비율 필드(`performanceRate`, `rate`, `rewardRate`): 0.0 ~ 1.0 사이의 실수
    - 목록 API 는 `page`, `size` 쿼리 파라미터를 지원하며 `PagedResponse` 래퍼로 응답한다.
    - 인증은 로그인 시 발급되는 토큰을 `Authorization: Bearer {token}` 헤더로 전달한다.
      (평가 범위 제외 지침에 따라 Security Schemes 는 본 명세에 정의하지 않는다.)

    ## 에러 코드 정책
    | 코드 | 의미 | 대표 사례 |
    |---|---|---|
    | 400 | 요청 값 검증 실패 | 시뮬레이션 파라미터 범위 초과 (화면 7 예외) |
    | 401 | 미인증 / 토큰 만료 | 로그인 필요 |
    | 403 | 액터 권한 불일치 | 고객이 `/issuer/**` 접근 |
    | 404 | 리소스 없음 | 존재하지 않는 카드·제안 ID |
    | 409 | 상태 충돌 | 이미 연결된 카드 재연결 |
    | 422 | 처리 불가 | 거래 데이터 부족으로 진단 불가 (화면 3 예외) |
  version: 1.0.0
  contact:
    name: 3반 P074 박수빈

servers:
  - url: http://localhost:8080/api
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 및 회원가입 (화면 1)
  - name: Customer-Card
    description: 고객 - 카드 데이터 연결 (화면 2)
  - name: Customer-Diagnosis
    description: 고객 - 실적·연회비 진단 (화면 3)
  - name: Customer-Channel
    description: 고객 - 페이·정기결제 현황 (화면 4)
  - name: Customer-Recommendation
    description: 고객 - 개선 제안 (화면 5)
  - name: Issuer-Dashboard
    description: 카드사 - 채널 포지션 대시보드 (화면 6)
  - name: Issuer-Simulation
    description: 카드사 - 혜택 정책 시뮬레이션 (화면 7)
  - name: Issuer-CardRule
    description: 카드사 - 카드·혜택 규칙 관리 (화면 8)
  - name: Common
    description: 공통 기준 정보 (채널·카테고리)
  - name: External
    description: 외부 시스템 - 결제 승인계 연동 (인터페이스만 정의)

paths:

  # ==========================================================================
  # [화면 1] 로그인 / 회원가입
  # ==========================================================================

  /auth/signup:
    post:
      tags: [Auth]
      summary: 회원가입
      description: |
        이메일·비밀번호로 회원가입한다. `role` 로 고객(CUSTOMER)과 카드사 담당자(ISSUER_MANAGER)를 구분한다.
        고객으로 가입하면 `customers` 프로필이 함께 생성되며, `joinedAt` 이 진단 가능 여부 판정 기준이 된다.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: 로그인
      description: |
        인증 성공 시 액세스 토큰과 사용자 정보를 반환한다.
        클라이언트는 `user.role` 값에 따라 고객은 화면 2(카드 연결), 카드사 담당자는 화면 6(대시보드)으로 진입한다.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: 내 계정 정보 조회
      description: 토큰으로 현재 로그인한 사용자 정보를 조회한다. 화면 진입 시 세션 확인 용도.
      operationId: getMyAccount
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # [화면 2] 카드 데이터 연결
  # ==========================================================================

  /cards/catalog:
    get:
      tags: [Customer-Card]
      summary: 연결 가능한 자사 카드 상품 목록
      description: |
        고객이 연결할 수 있는 자사 카드 상품 목록을 조회한다.
        `isActive = true` 인 상품만 반환하며, 타사 카드는 포함하지 않는다(범위 원칙).
      operationId: getCardCatalog
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/cards:
    get:
      tags: [Customer-Card]
      summary: 내 보유 카드 목록 조회
      description: |
        고객이 연결한 자사 카드 목록을 조회한다. 화면 2 상단 목록에 사용되며,
        최적 배치 탐색의 후보 집합이기도 하다.
      operationId: getMyCards
      parameters:
        - name: linkedOnly
          in: query
          required: false
          description: true 이면 연결 상태(isLinked = true)인 카드만 반환
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerCard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Customer-Card]
      summary: 카드 연결
      description: |
        보유한 자사 카드를 서비스에 연결한다. 연결 즉시 결제 데이터 동기화가 예약된다.
        동일 고객이 동일 카드번호를 중복 연결하면 409 를 반환한다.
      operationId: linkCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardLinkRequest'
      responses:
        '201':
          description: 연결 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/cards/{customerCardId}:
    delete:
      tags: [Customer-Card]
      summary: 카드 연결 해제
      description: |
        카드 연결을 해제한다(`isLinked = false`). 거래 이력과 과거 제안 근거는 보존되며,
        이후 진단 및 제안 대상에서만 제외된다.
      operationId: unlinkCard
      parameters:
        - $ref: '#/components/parameters/CustomerCardIdPath'
      responses:
        '204':
          description: 연결 해제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/cards/{customerCardId}/sync:
    post:
      tags: [Customer-Card]
      summary: 결제 데이터 동기화
      description: |
        해당 카드의 결제 데이터를 재수집한다. 화면 2 의 동기화 버튼에 대응하며,
        완료 시 `lastSyncedAt` 이 갱신되고 수집된 거래 건수를 반환한다.
      operationId: syncCardTransactions
      parameters:
        - $ref: '#/components/parameters/CustomerCardIdPath'
      responses:
        '200':
          description: 동기화 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # [화면 3] 실적·연회비 진단
  # ==========================================================================

  /me/diagnosis/performance:
    get:
      tags: [Customer-Diagnosis]
      summary: 실적·연회비 진단 조회
      description: |
        보유 카드별 인정실적, 실적 구간, 실효 혜택, 연간 순이익을 산출해 반환한다.

        **산출 로직**
        1. 인정실적 = Σ(결제액 × 카테고리인정률 × 채널인정률)
        2. 인정실적으로 실적 구간 판정 → 적용 혜택 세트 확정
        3. 실효혜택 = min( Σ min(결제액 × 할인율, 항목월한도), 통합월한도 )
        4. 연간 순이익 = ((실효혜택 + 채널적립) × 12) − 연회비

        **예외 시나리오 (화면 3)**
        가입 1개월 미만이거나 기준월 거래 데이터가 없으면 진단이 불가하며 `422` 를 반환한다.
        응답 본문의 `code` 는 `INSUFFICIENT_TRANSACTION_DATA` 이다.
      operationId: getPerformanceDiagnosis
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 진단 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerformanceDiagnosisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  /me/cards/{customerCardId}/exclusions:
    get:
      tags: [Customer-Diagnosis]
      summary: 실적 제외 내역 조회
      description: |
        기준월 거래 중 실적에서 제외되었거나 일부만 인정된 내역을 사유와 함께 반환한다.
        제외 사유는 카테고리 인정률 0(공과금·통신비 등)과 채널 인정률 미달(간편결제 정책) 두 가지로 구분된다.
        화면 3 의 "왜 실적이 미달인가"에 답하는 데이터다.
      operationId: getPerformanceExclusions
      parameters:
        - $ref: '#/components/parameters/CustomerCardIdPath'
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExclusionItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/cards/{customerCardId}/benefit-blocks:
    get:
      tags: [Customer-Diagnosis]
      summary: 업종 할인 미적용 내역 조회
      description: |
        **실적 제외와는 다른 손실**을 반환한다.

        간편결제·PG 를 경유한 결제는 가맹점 정보가 페이사 대표 가맹점(예: 네이버파이낸셜)으로 넘어와
        업종 판정이 불가능하다. 이 때문에 다수 카드 약관이 "간편결제 이용 건은 영역별 할인 대상에서 제외"를
        명시한다. 결과적으로 **전월실적에는 정상 반영되지만 업종별 할인·적립만 받지 못하는** 결제가 발생한다.

        판정 기준은 `card_channel_rates.is_benefit_eligible = false` 이며,
        해당 거래에 적용되었어야 할 혜택 규칙으로 손실액을 역산한다.
      operationId: getBenefitBlocks
      parameters:
        - $ref: '#/components/parameters/CustomerCardIdPath'
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitBlockResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/points:
    get:
      tags: [Customer-Diagnosis]
      summary: 포인트 잔액·소멸 예정 조회
      description: 보유 카드별 포인트 잔액과 3개월 내 소멸 예정 포인트를 조회한다.
      operationId: getMyPoints
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointBalance'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # [화면 4] 페이·정기결제 현황
  # ==========================================================================

  /me/channels/usage:
    get:
      tags: [Customer-Channel]
      summary: 채널별 결제 비중 조회
      description: |
        기준월의 결제 채널별 결제액·비중과, 각 채널에서 현재 사용 중인 카드의 인정률을 반환한다.
        `performanceRate` 가 1.0 미만인 채널이 실적 손실이 발생하고 있는 지점이다.
      operationId: getChannelUsage
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelUsageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  /me/subscriptions:
    get:
      tags: [Customer-Channel]
      summary: 정기결제 목록 조회
      description: |
        정기결제 목록을 연결 카드·금액·실적 인정 여부와 함께 반환한다.
        `isPerformanceRecognized = false` 인 항목이 실적 사각지대이며 개선 제안의 주요 대상이 된다.
      operationId: getMySubscriptions
      parameters:
        - name: status
          in: query
          required: false
          description: 정기결제 상태 필터
          schema:
            type: string
            enum: [ACTIVE, PAUSED, CANCELED]
            default: ACTIVE
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/subscriptions/{subscriptionId}:
    patch:
      tags: [Customer-Channel]
      summary: 정기결제 결제카드 변경 반영
      description: |
        정기결제의 결제 카드 변경을 서비스에 반영한다.
        각 서비스사 시스템에서의 실제 변경은 범위 밖이며, 본 API 는 고객이 변경을 완료했음을 기록한다.
        변경 대상 카드는 고객이 보유한 자사 카드여야 한다.
      operationId: updateSubscriptionCard
      parameters:
        - $ref: '#/components/parameters/SubscriptionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateRequest'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # [화면 5] 개선 제안
  # ==========================================================================

  /me/recommendations:
    post:
      tags: [Customer-Recommendation]
      summary: 개선 제안 산출 실행
      description: |
        기준월 데이터로 최적 배치를 탐색해 제안을 생성한다.

        **탐색 대상**: (페이 채널 × 보유 카드), (정기결제 × 보유 카드) 조합 중 연간 순이익 합계 최대
        **범위 제한**: 후보는 고객이 이미 보유한 자사 카드로 한정한다.

        산출된 수치는 서버 규칙 엔진의 확정값이며, `explanation` 은 그 수치를 설명하는 자연어 문장이다.

        **예외 시나리오 (화면 5)**
        현재 배치가 이미 최적이면 `annualGain = 0`, `status = NO_CHANGE_NEEDED` 로 생성되며
        `details` 는 빈 배열이다. 이 경우에도 정상 응답(201)이다.
      operationId: createRecommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationCreateRequest'
      responses:
        '201':
          description: 제안 산출 완료 (변경 실익 없음 케이스 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  /me/recommendations/latest:
    get:
      tags: [Customer-Recommendation]
      summary: 최신 제안 조회
      description: |
        가장 최근에 산출된 제안을 상세(`details`)와 함께 반환한다. 화면 5 진입 시 호출된다.
        아직 산출 이력이 없으면 404 를 반환하며, 클라이언트는 산출 실행 버튼을 노출한다.
      operationId: getLatestRecommendation
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/recommendations/{recommendationId}:
    get:
      tags: [Customer-Recommendation]
      summary: 제안 상세 조회
      description: |
        특정 제안의 차분 상세를 조회한다.
        각 항목은 계산 시점의 인정률·할인율·한도를 `snapshot*` 필드로 보관하고 있어,
        이후 혜택 규칙이 변경되어도 당시 제안 근거가 그대로 재현된다.
      operationId: getRecommendation
      parameters:
        - $ref: '#/components/parameters/RecommendationIdPath'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /me/recommendations/{recommendationId}/accept:
    post:
      tags: [Customer-Recommendation]
      summary: 제안 수락
      description: |
        제안을 수락 처리한다(`status = ACCEPTED`, `acceptedAt` 기록).
        제안 수락률 지표의 산출 근거가 된다.
        `NO_CHANGE_NEEDED` 상태의 제안은 수락 대상이 아니므로 409 를 반환한다.
      operationId: acceptRecommendation
      parameters:
        - $ref: '#/components/parameters/RecommendationIdPath'
      responses:
        '200':
          description: 수락 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /me/benefit-utilization:
    get:
      tags: [Customer-Recommendation]
      summary: 카테고리별 혜택 활용도 조회
      description: |
        카테고리(외식·카페·쇼핑 등)별로 현재 받고 있는 혜택과, 보유 카드 중 최선의 혜택을 비교해
        얼마를 놓치고 있는지 산출한다. 카드마다 카테고리별 할인·적립률이 다르기 때문에
        같은 금액을 결제해도 어느 카드로 결제하느냐에 따라 실효 혜택이 달라진다.

        `catalogAlternative` 는 고객이 보유하지 않은 **자사 카드 상품** 중 해당 카테고리에서
        더 유리한 상품을 참고로 제시한다. 타사 카드는 포함하지 않으며, 주 제안은 어디까지나
        보유 카드 내 재배치다.
      operationId: getBenefitUtilization
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitUtilizationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  /me/card-suggestions:
    get:
      tags: [Customer-Recommendation]
      summary: 신규 카드 발급 추천 조회
      description: |
        보유 카드 재배치만으로 도달할 수 없는 구간을, **자사 카탈로그의 미보유 상품**으로
        메울 수 있는지 판정한다.

        **범위 원칙** — 후보는 자사 상품으로만 한정한다. 타사 카드는 비교 대상이 아니다.

        **판정 방식**
        1. 기준선: 보유 카드만으로 (채널 × 카테고리) 단위 최적 배치 시의 연간 순이익
        2. 후보별: 해당 카드를 더해 다시 최적 배치했을 때의 연간 순이익
        3. `annualGain = (후보 순이익) − (기준선)` — **연회비를 차감한 뒤에도 양수인 상품만 반환**

        채널 단위가 아니라 카테고리 단위로 배분하는 이유는, 결제 시점마다 사용할 카드를
        고를 수 있어 "카페는 A카드, 외식은 B카드"가 실제로 가능한 배치이기 때문이다.
        추천 근거로 어떤 소비 항목에서 이득이 발생하는지 함께 반환한다.
      operationId: getCardSuggestions
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공. 조건을 만족하는 상품이 없으면 candidates 는 빈 배열이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardSuggestionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  /me/alerts/tier-gap:
    get:
      tags: [Customer-Recommendation]
      summary: 실적 구간 근접 안내 조회
      description: |
        상위 실적 구간까지 남은 금액이 임계치 이하인 카드를 반환한다.
        "3만원만 더 쓰면 다음 구간"과 같은 안내에 사용된다.
        근접 카드가 없으면 빈 배열을 반환한다.
      operationId: getTierGapAlerts
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TierGapAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/DiagnosisUnavailable'

  # ==========================================================================
  # [화면 6] 카드사 - 채널 포지션 대시보드
  # ==========================================================================

  /issuer/dashboard/summary:
    get:
      tags: [Issuer-Dashboard]
      summary: 대시보드 요약 지표 조회
      description: |
        기준월의 전체 고객 규모, 실적 미달 고객 수, 정기결제 보유 고객 비중 등
        화면 6 상단 요약 카드에 표시되는 지표를 반환한다.
      operationId: getIssuerDashboardSummary
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /issuer/dashboard/channels:
    get:
      tags: [Issuer-Dashboard]
      summary: 채널별 자사 카드 포지션 조회
      description: |
        페이 채널별 자사 카드 연결 비중, 결제액, 인정률 정책, 실적 미달 고객 수를 반환한다.
        `months` 로 최근 N개월 추이를 함께 요청할 수 있으며 화면 6 의 추이 차트에 사용된다.
      operationId: getChannelPositions
      parameters:
        - $ref: '#/components/parameters/BaseMonthQuery'
        - name: months
          in: query
          required: false
          description: 추이 조회 개월 수 (1~12)
          schema:
            type: integer
            minimum: 1
            maximum: 12
            default: 6
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelPositionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================================================
  # [화면 7] 카드사 - 혜택 정책 시뮬레이션
  # ==========================================================================

  /issuer/simulations:
    post:
      tags: [Issuer-Simulation]
      summary: 혜택 정책 시뮬레이션 실행
      description: |
        채널 인정률·한도·실적 구간을 변경했을 때의 비용과 효과를 사전 계산한다.
        기준월 실거래 데이터에 변경 파라미터를 적용해 재계산하며, 실제 정책은 변경되지 않는다.

        **응답 지표**: 실적 충족 고객 수 변화, 혜택 지급 비용 변화, 순효과

        **예외 시나리오 (화면 7)**
        파라미터가 허용 범위를 벗어나면 `400` 을 반환한다.
        - `performanceRate`, `rate`: 0.0 ~ 1.0
        - `monthlyItemLimit`, `totalMonthlyBenefitLimit`: 0 이상
        - `minPerformance`: 0 이상이며 구간 간 역전 불가

        시뮬레이션 결과는 저장하지 않으며 응답으로만 반환한다.
      operationId: runSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
      responses:
        '200':
          description: 시뮬레이션 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issuer/segments:
    post:
      tags: [Issuer-Simulation]
      summary: 세그먼트 추출
      description: |
        시뮬레이션 조건에 해당하는 고객군을 추출한다.
        안내 대상 지정을 위한 조회 기능이며, 추출 결과는 저장하지 않는다.
      operationId: extractSegment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SegmentRequest'
      responses:
        '200':
          description: 추출 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ==========================================================================
  # [화면 8] 카드사 - 카드·혜택 규칙 관리
  # ==========================================================================

  /issuer/cards:
    get:
      tags: [Issuer-CardRule]
      summary: 카드 상품 목록 조회
      description: 자사 카드 상품 목록을 조회한다. 판매 중지 상품(`isActive = false`)도 포함된다.
      operationId: getIssuerCards
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PagedResponse'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Issuer-CardRule]
      summary: 카드 상품 등록
      description: 신규 카드 상품을 등록한다. 등록 후 실적 구간과 혜택 규칙을 별도로 설정한다.
      operationId: createCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpsertRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /issuer/cards/{cardId}:
    get:
      tags: [Issuer-CardRule]
      summary: 카드 상품 상세 조회
      description: |
        카드 상품 정보와 함께 실적 구간, 혜택 규칙, 채널별 인정률을 한 번에 조회한다.
        화면 8 의 카드 선택 시 하단 편집 패널에 표시되는 데이터다.
      operationId: getCardDetail
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Issuer-CardRule]
      summary: 카드 상품 수정
      description: 카드 상품의 기본 정보(연회비, 통합 월한도 등)를 수정한다.
      operationId: updateCard
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardUpsertRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issuer/cards/{cardId}/tiers:
    get:
      tags: [Issuer-CardRule]
      summary: 실적 구간 목록 조회
      operationId: getPerformanceTiers
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceTier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Issuer-CardRule]
      summary: 실적 구간 일괄 설정
      description: |
        카드의 실적 구간을 일괄 교체한다. `tierLevel` 0(미달) 구간은 필수이며,
        구간 간 금액 경계가 역전되면 400 을 반환한다.
      operationId: updatePerformanceTiers
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PerformanceTierUpsertRequest'
      responses:
        '200':
          description: 설정 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PerformanceTier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issuer/cards/{cardId}/benefit-rules:
    get:
      tags: [Issuer-CardRule]
      summary: 혜택 규칙 목록 조회
      description: 카드의 카테고리별·실적구간별 혜택 규칙을 조회한다.
      operationId: getBenefitRules
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
        - name: tierLevel
          in: query
          required: false
          description: 특정 실적 구간의 규칙만 조회
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BenefitRule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Issuer-CardRule]
      summary: 혜택 규칙 등록
      description: |
        카드 × 카테고리 × 실적구간 조합으로 혜택 규칙을 등록한다.
        동일 조합이 이미 존재하면 409 를 반환한다.
      operationId: createBenefitRule
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitRuleUpsertRequest'
      responses:
        '201':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /issuer/benefit-rules/{ruleId}:
    put:
      tags: [Issuer-CardRule]
      summary: 혜택 규칙 수정
      description: 할인율, 건당/항목월 한도, 최소 결제금액을 수정한다.
      operationId: updateBenefitRule
      parameters:
        - $ref: '#/components/parameters/RuleIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitRuleUpsertRequest'
      responses:
        '200':
          description: 수정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitRule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Issuer-CardRule]
      summary: 혜택 규칙 삭제
      description: |
        혜택 규칙을 삭제한다. 과거 제안은 계산 시점 스냅샷으로 근거를 보관하므로
        규칙 삭제의 영향을 받지 않는다.
      operationId: deleteBenefitRule
      parameters:
        - $ref: '#/components/parameters/RuleIdPath'
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /issuer/cards/{cardId}/channel-rates:
    get:
      tags: [Issuer-CardRule]
      summary: 채널별 인정률 조회
      description: |
        카드 × 채널 교차 인정률을 조회한다.
        채널 인정률은 카드 속성도 채널 속성도 아닌 교차 속성이므로 별도 리소스로 관리한다.
      operationId: getCardChannelRates
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardChannelRate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Issuer-CardRule]
      summary: 채널별 인정률 일괄 설정
      description: |
        카드의 채널별 인정률을 일괄 설정한다. `effectiveFrom` 기준으로 이력이 보존되며,
        수정자(`updatedBy`)가 함께 기록된다. 인정률은 0.0 ~ 1.0 범위를 벗어나면 400 이다.
      operationId: updateCardChannelRates
      parameters:
        - $ref: '#/components/parameters/CardIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CardChannelRateUpsertRequest'
      responses:
        '200':
          description: 설정 완료
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CardChannelRate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==========================================================================
  # [공통] 기준 정보
  # ==========================================================================

  /channels:
    get:
      tags: [Common]
      summary: 결제 채널 목록 조회
      description: 실물카드를 포함한 결제 채널 마스터를 조회한다. 화면 4·5·6·8 의 채널 선택에 공통 사용된다.
      operationId: getPayChannels
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PayChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /categories:
    get:
      tags: [Common]
      summary: 소비 카테고리 목록 조회
      description: 소비 카테고리 마스터를 조회한다. 기본 인정률과 실적 제외 여부를 함께 반환한다.
      operationId: getSpendingCategories
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpendingCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================================================
  # [외부 시스템] 결제 승인계 연동 — 인터페이스만 정의, 구현 제외
  # ==========================================================================

  /external/transactions:
    post:
      tags: [External]
      summary: 거래 데이터 수신
      description: |
        결제 승인계(외부 시스템)가 승인 완료된 거래를 송신하는 인터페이스다.
        본 프로젝트에서는 **명세만 정의하고 구현은 제외**한다.

        - `externalTxId` 를 멱등성 키로 사용하며, 이미 수신한 거래는 200 으로 응답하고 무시한다.
        - `merchantName` 은 간편결제·PG 경유 시 식별이 어려운 형태로 들어오며,
          서버가 업종 정규화를 거쳐 `categoryId` 로 매핑한다.
        - 정규화에 실패한 거래는 저장되되 혜택 산출에서 제외된다.
      operationId: ingestTransactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionIngestRequest'
      responses:
        '201':
          description: 수신 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionIngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================================================
# 재사용 컴포넌트
# ============================================================================
components:

  # --------------------------------------------------------------------------
  # 공통 파라미터
  # --------------------------------------------------------------------------
  parameters:

    PageQuery:
      name: page
      in: query
      required: false
      description: 페이지 번호 (0부터 시작)
      schema:
        type: integer
        minimum: 0
        default: 0

    SizeQuery:
      name: size
      in: query
      required: false
      description: 페이지 당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    BaseMonthQuery:
      name: baseMonth
      in: query
      required: false
      description: 산출 기준월 (YYYY-MM). 생략 시 직전 월을 사용한다.
      schema:
        type: string
        pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        example: '2026-08'

    CustomerCardIdPath:
      name: customerCardId
      in: path
      required: true
      description: 보유 카드 ID
      schema:
        type: integer
        format: int64
        example: 101

    CardIdPath:
      name: cardId
      in: path
      required: true
      description: 카드 상품 ID
      schema:
        type: integer
        format: int64
        example: 1

    SubscriptionIdPath:
      name: subscriptionId
      in: path
      required: true
      description: 정기결제 ID
      schema:
        type: integer
        format: int64
        example: 501

    RecommendationIdPath:
      name: recommendationId
      in: path
      required: true
      description: 제안 ID
      schema:
        type: integer
        format: int64
        example: 9001

    RuleIdPath:
      name: ruleId
      in: path
      required: true
      description: 혜택 규칙 ID
      schema:
        type: integer
        format: int64
        example: 3001

  # --------------------------------------------------------------------------
  # 공통 에러 응답
  # --------------------------------------------------------------------------
  responses:

    BadRequest:
      description: 요청 값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_PARAMETER
            message: 채널 인정률은 0.0 이상 1.0 이하여야 합니다.
            field: channelRates[0].performanceRate
            timestamp: '2026-09-08T14:00:00'

    Unauthorized:
      description: 미인증 또는 토큰 만료
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: 로그인이 필요합니다.
            timestamp: '2026-09-08T14:00:00'

    Forbidden:
      description: 액터 권한 불일치
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: 카드사 담당자만 접근할 수 있습니다.
            timestamp: '2026-09-08T14:00:00'

    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 해당 카드를 찾을 수 없습니다.
            timestamp: '2026-09-08T14:00:00'

    Conflict:
      description: 현재 상태에서 처리할 수 없는 요청
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: ALREADY_LINKED_CARD
            message: 이미 연결된 카드입니다.
            timestamp: '2026-09-08T14:00:00'

    DiagnosisUnavailable:
      description: |
        진단 불가 — 거래 데이터 부족 (화면 3 예외 시나리오).
        가입 1개월 미만이거나 기준월 거래가 없는 경우 반환된다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INSUFFICIENT_TRANSACTION_DATA
            message: 가입 후 1개월이 지나야 진단할 수 있습니다. 결제 데이터가 쌓이면 자동으로 안내해 드립니다.
            detail: 가입일 2026-08-25 / 필요 거래 기간 30일 / 현재 14일
            timestamp: '2026-09-08T14:00:00'

  # --------------------------------------------------------------------------
  # 스키마
  # --------------------------------------------------------------------------
  schemas:

    # ===== 공통 =====

    Error:
      type: object
      description: 모든 에러 응답의 공통 구조
      required: [code, message, timestamp]
      properties:
        code:
          type: string
          description: 에러 코드 (클라이언트 분기용)
          example: INSUFFICIENT_TRANSACTION_DATA
        message:
          type: string
          description: 사용자에게 노출할 메시지
          example: 가입 후 1개월이 지나야 진단할 수 있습니다.
        field:
          type: string
          description: 검증 실패한 필드 경로 (400 응답에서만)
          example: performanceRate
        detail:
          type: string
          description: 부가 설명
        timestamp:
          type: string
          format: date-time
          example: '2026-09-08T14:00:00'

    PagedResponse:
      type: object
      description: 목록 응답 공통 래퍼
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          example: 3

    # ===== 계정 (users, customers) =====

    User:
      type: object
      description: |
        계정 정보 (users). 고객(CUSTOMER)인 경우 프로필(customers)의 joinedAt 을 함께 반환한다.
      required: [id, email, name, role]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: subin@paymix.co.kr
        name:
          type: string
          example: 박수빈
        role:
          type: string
          enum: [CUSTOMER, ISSUER_MANAGER]
          description: 'CUSTOMER: 고객 / ISSUER_MANAGER: 카드사 담당자'
          example: CUSTOMER
        joinedAt:
          type: string
          format: date
          description: 고객인 경우 카드사 가입일 (진단 가능 여부 판정 기준)
          example: '2025-03-14'
        createdAt:
          type: string
          format: date-time

    SignupRequest:
      type: object
      required: [email, password, name, role]
      properties:
        email:
          type: string
          format: email
          example: subin@paymix.co.kr
        password:
          type: string
          format: password
          minLength: 8
          description: 8자 이상
        name:
          type: string
          maxLength: 50
          example: 박수빈
        role:
          type: string
          enum: [CUSTOMER, ISSUER_MANAGER]
          example: CUSTOMER
        birthYear:
          type: integer
          description: 고객 가입 시에만 사용
          example: 1999

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: subin@paymix.co.kr
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 이후 요청의 Authorization 헤더에 Bearer 토큰으로 전달
        user:
          $ref: '#/components/schemas/User'

    # ===== 기준 정보 (pay_channels, spending_categories) =====

    PayChannel:
      type: object
      description: 결제 채널 (pay_channels)
      properties:
        id:
          type: integer
          format: int64
          example: 3
        code:
          type: string
          example: NAVER_PAY
        name:
          type: string
          example: 네이버페이
        channelType:
          type: string
          enum: [PHYSICAL, MOBILE_PAY, ONLINE_PAY]
          example: ONLINE_PAY
        rewardRate:
          type: number
          format: double
          description: 채널 자체 적립률 (0.0 ~ 1.0). 카드 혜택과 별개로 페이사가 지급
          example: 0.02
        logoUrl:
          type: string
        isActive:
          type: boolean
          example: true

    SpendingCategory:
      type: object
      description: 소비 카테고리 (spending_categories)
      properties:
        id:
          type: integer
          format: int64
          example: 7
        code:
          type: string
          example: TELECOM
        name:
          type: string
          example: 통신비
        defaultPerformanceRate:
          type: number
          format: double
          description: 기본 카테고리 인정률 (0.0 ~ 1.0). 0 이면 실적 미인정
          example: 0.0
        isExcludedByDefault:
          type: boolean
          description: true 이면 실적 제외 카테고리
          example: true
        displayOrder:
          type: integer
          example: 5

    # ===== 카드 상품 (cards, card_performance_tiers, benefit_rules, card_channel_rates) =====

    Card:
      type: object
      description: 카드 상품 (cards)
      properties:
        id:
          type: integer
          format: int64
          example: 1
        cardCode:
          type: string
          example: PM-PLATINUM
        name:
          type: string
          example: PayMix 플래티넘
        brand:
          type: string
          example: VISA
        annualFee:
          type: integer
          description: 연회비(원)
          example: 30000
        totalMonthlyBenefitLimit:
          type: integer
          nullable: true
          description: 카드 전체 통합 월 한도(원). null 이면 무제한
          example: 50000
        description:
          type: string
          example: 간편결제 채널 전 구간 실적 100% 인정
        imageUrl:
          type: string
        isActive:
          type: boolean
          example: true

    CardDetail:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          description: 카드 상품 + 규칙 일체 (화면 8 편집 패널)
          properties:
            tiers:
              type: array
              items:
                $ref: '#/components/schemas/PerformanceTier'
            benefitRules:
              type: array
              items:
                $ref: '#/components/schemas/BenefitRule'
            channelRates:
              type: array
              items:
                $ref: '#/components/schemas/CardChannelRate'

    CardUpsertRequest:
      type: object
      required: [cardCode, name, annualFee]
      properties:
        cardCode:
          type: string
          maxLength: 30
          example: PM-PLATINUM
        name:
          type: string
          maxLength: 100
          example: PayMix 플래티넘
        brand:
          type: string
          example: VISA
        annualFee:
          type: integer
          minimum: 0
          example: 30000
        totalMonthlyBenefitLimit:
          type: integer
          minimum: 0
          nullable: true
          example: 50000
        description:
          type: string
          maxLength: 500
        imageUrl:
          type: string
        isActive:
          type: boolean
          default: true

    PerformanceTier:
      type: object
      description: 실적 구간 (card_performance_tiers)
      properties:
        id:
          type: integer
          format: int64
          example: 11
        cardId:
          type: integer
          format: int64
          example: 1
        tierLevel:
          type: integer
          description: 0 = 실적 미달, 1 이상 = 충족 구간
          example: 2
        tierName:
          type: string
          example: 50만원 이상
        minPerformance:
          type: integer
          description: 구간 하한 인정실적(원)
          example: 500000
        maxPerformance:
          type: integer
          nullable: true
          description: 구간 상한 인정실적(원). null 이면 상한 없음
          example: null

    PerformanceTierUpsertRequest:
      type: object
      required: [tierLevel, tierName, minPerformance]
      properties:
        tierLevel:
          type: integer
          minimum: 0
          example: 2
        tierName:
          type: string
          maxLength: 50
          example: 50만원 이상
        minPerformance:
          type: integer
          minimum: 0
          example: 500000
        maxPerformance:
          type: integer
          minimum: 0
          nullable: true

    BenefitRule:
      type: object
      description: 혜택 규칙 (benefit_rules)
      properties:
        id:
          type: integer
          format: int64
          example: 3001
        cardId:
          type: integer
          format: int64
          example: 1
        categoryId:
          type: integer
          format: int64
          example: 2
        categoryName:
          type: string
          description: 화면 표시용 카테고리명
          example: 외식
        tierId:
          type: integer
          format: int64
          example: 11
        tierLevel:
          type: integer
          description: 이 규칙이 적용되는 실적 구간
          example: 2
        benefitType:
          type: string
          enum: [DISCOUNT, POINT]
          example: DISCOUNT
        rate:
          type: number
          format: double
          description: 할인율 또는 적립률 (0.0 ~ 1.0)
          example: 0.1
        perTransactionLimit:
          type: integer
          nullable: true
          description: 건당 한도(원)
          example: 5000
        monthlyItemLimit:
          type: integer
          nullable: true
          description: 항목별 월 한도(원)
          example: 20000
        minTransactionAmount:
          type: integer
          description: 혜택 적용 최소 결제금액(원)
          example: 10000
        isActive:
          type: boolean
          example: true

    BenefitRuleUpsertRequest:
      type: object
      required: [categoryId, tierId, benefitType, rate]
      properties:
        categoryId:
          type: integer
          format: int64
          example: 2
        tierId:
          type: integer
          format: int64
          example: 11
        benefitType:
          type: string
          enum: [DISCOUNT, POINT]
          example: DISCOUNT
        rate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          example: 0.1
        perTransactionLimit:
          type: integer
          minimum: 0
          nullable: true
          example: 5000
        monthlyItemLimit:
          type: integer
          minimum: 0
          nullable: true
          example: 20000
        minTransactionAmount:
          type: integer
          minimum: 0
          default: 0
        isActive:
          type: boolean
          default: true

    CardChannelRate:
      type: object
      description: |
        카드 × 채널 인정률 (card_channel_rates).
        채널 인정률은 카드 속성도 채널 속성도 아닌 교차 속성이므로 독립 리소스로 관리한다.
      properties:
        id:
          type: integer
          format: int64
          example: 201
        cardId:
          type: integer
          format: int64
          example: 1
        channelId:
          type: integer
          format: int64
          example: 3
        channelName:
          type: string
          example: 네이버페이
        performanceRate:
          type: number
          format: double
          description: 채널 인정률 (0.0 ~ 1.0). 실물 1.0, 간편결제는 카드사 정책
          example: 0.5
        isBenefitEligible:
          type: boolean
          description: false 이면 해당 채널 결제에 카드 혜택을 적용하지 않음
          example: true
        effectiveFrom:
          type: string
          format: date
          example: '2026-01-01'
        updatedBy:
          type: integer
          format: int64
          nullable: true
          description: 인정률을 수정한 카드사 담당자 user id
        updatedAt:
          type: string
          format: date-time

    CardChannelRateUpsertRequest:
      type: object
      required: [channelId, performanceRate, effectiveFrom]
      properties:
        channelId:
          type: integer
          format: int64
          example: 3
        performanceRate:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 0.0 ~ 1.0 범위를 벗어나면 400
          example: 0.5
        isBenefitEligible:
          type: boolean
          default: true
        effectiveFrom:
          type: string
          format: date
          example: '2026-10-01'

    # ===== 보유 카드 (customer_cards, point_balances) =====

    CustomerCard:
      type: object
      description: 고객 보유 카드 (customer_cards)
      properties:
        id:
          type: integer
          format: int64
          example: 101
        cardId:
          type: integer
          format: int64
          example: 1
        cardName:
          type: string
          example: PayMix 플래티넘
        cardAlias:
          type: string
          nullable: true
          example: 주력카드
        maskedNumber:
          type: string
          example: 1234-****-****-5678
        annualFee:
          type: integer
          example: 30000
        imageUrl:
          type: string
        isLinked:
          type: boolean
          example: true
        linkedAt:
          type: string
          format: date-time
        lastSyncedAt:
          type: string
          format: date-time
          nullable: true

    CardLinkRequest:
      type: object
      required: [cardId, maskedNumber]
      properties:
        cardId:
          type: integer
          format: int64
          example: 1
        maskedNumber:
          type: string
          pattern: '^\d{4}-\*{4}-\*{4}-\d{4}$'
          example: 1234-****-****-5678
        cardAlias:
          type: string
          maxLength: 50
          example: 주력카드

    CardSyncResult:
      type: object
      properties:
        customerCardId:
          type: integer
          format: int64
          example: 101
        syncedTransactionCount:
          type: integer
          description: 이번 동기화로 수집된 거래 건수
          example: 87
        lastSyncedAt:
          type: string
          format: date-time

    PointBalance:
      type: object
      description: 포인트 현황 (point_balances)
      properties:
        customerCardId:
          type: integer
          format: int64
          example: 101
        cardName:
          type: string
          example: PayMix 플래티넘
        balance:
          type: integer
          description: 포인트 잔액(P)
          example: 12400
        expiringAmount:
          type: integer
          description: 3개월 내 소멸 예정 포인트(P)
          example: 3200
        expiringAt:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'

    # ===== 진단 (화면 3) =====

    PerformanceDiagnosisResponse:
      type: object
      description: 실적·연회비 진단 결과
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        totalAnnualNetBenefit:
          type: integer
          description: 보유 카드 전체 연간 순이익 합계(원)
          example: 246000
        cards:
          type: array
          items:
            $ref: '#/components/schemas/CardDiagnosis'

    CardDiagnosis:
      type: object
      description: 카드 1장의 진단 결과. 산출로직 (1)~(4) 의 결과값을 모두 포함한다.
      properties:
        customerCardId:
          type: integer
          format: int64
          example: 101
        cardName:
          type: string
          example: PayMix 플래티넘
        maskedNumber:
          type: string
          example: 1234-****-****-5678
        totalSpending:
          type: integer
          description: 기준월 총 결제액(원)
          example: 820000
        recognizedPerformance:
          type: integer
          description: '산출로직 (1) 인정실적(원) = Σ(결제액 × 카테고리인정률 × 채널인정률)'
          example: 430000
        excludedAmount:
          type: integer
          description: 실적에서 제외된 금액(원) = 총 결제액 − 인정실적
          example: 390000
        currentTierLevel:
          type: integer
          description: '산출로직 (2) 판정된 실적 구간. 0 이면 미달'
          example: 1
        currentTierName:
          type: string
          example: 30만원 이상
        nextTierName:
          type: string
          nullable: true
          example: 50만원 이상
        amountToNextTier:
          type: integer
          nullable: true
          description: 상위 구간까지 남은 인정실적(원)
          example: 70000
        effectiveBenefit:
          type: integer
          description: '산출로직 (3) 실효 혜택(원) = min(Σ min(결제액×할인율, 항목월한도), 통합월한도)'
          example: 28000
        nominalBenefit:
          type: integer
          description: 한도 적용 전 명목 혜택(원). 실효 혜택과의 차이가 한도 소진분이다
          example: 41000
        channelReward:
          type: integer
          description: 채널 자체 적립(원)
          example: 4600
        annualFee:
          type: integer
          example: 30000
        annualNetBenefit:
          type: integer
          description: '산출로직 (4) 연간 순이익(원) = ((실효혜택 + 채널적립) × 12) − 연회비'
          example: 361200
        pointBalance:
          type: integer
          example: 12400

    ExclusionItem:
      type: object
      description: 실적 제외 내역 1건
      properties:
        transactionId:
          type: integer
          format: int64
          example: 77001
        merchantName:
          type: string
          example: SKT 통신요금
        categoryName:
          type: string
          example: 통신비
        channelName:
          type: string
          example: 실물카드
        amount:
          type: integer
          example: 68000
        categoryPerformanceRate:
          type: number
          format: double
          example: 0.0
        channelPerformanceRate:
          type: number
          format: double
          example: 1.0
        recognizedAmount:
          type: integer
          description: 실제 인정된 금액(원)
          example: 0
        exclusionReason:
          type: string
          enum: [CATEGORY_EXCLUDED, CHANNEL_NOT_RECOGNIZED, PARTIALLY_RECOGNIZED]
          description: |
            - CATEGORY_EXCLUDED: 카테고리 인정률 0 (공과금·통신비 등)
            - CHANNEL_NOT_RECOGNIZED: 채널 인정률 0 (간편결제 정책)
            - PARTIALLY_RECOGNIZED: 일부만 인정
          example: CATEGORY_EXCLUDED
        reasonMessage:
          type: string
          example: 통신비 자동이체는 실적에 반영되지 않습니다.
        approvedAt:
          type: string
          format: date-time

    BenefitBlockResponse:
      type: object
      description: 업종 할인 미적용 내역 (실적에는 반영되나 할인만 못 받은 결제)
      properties:
        customerCardId:
          type: integer
          format: int64
          example: 102
        cardName:
          type: string
          example: PayMix 클래식
        blockedAmount:
          type: integer
          description: 업종 할인이 적용되지 않은 결제액 합계(원)
          example: 573000
        blockedCount:
          type: integer
          description: 해당 거래 건수
          example: 7
        lostBenefit:
          type: integer
          description: 그로 인해 받지 못한 할인·적립 합계(원). 건당·항목월·통합월 한도 적용 후
          example: 13100
        blockedChannels:
          type: array
          description: 업종 할인이 적용되지 않는 채널명
          items:
            type: string
          example: [네이버페이, 카카오페이]
        items:
          type: array
          items:
            $ref: '#/components/schemas/BenefitBlockItem'

    BenefitBlockItem:
      type: object
      description: 업종 할인을 받지 못한 거래 1건
      properties:
        transactionId:
          type: integer
          format: int64
          example: 77013
        merchantName:
          type: string
          example: 네이버페이_쿠팡
        categoryId:
          type: integer
          format: int64
          example: 2
        categoryName:
          type: string
          example: 쇼핑
        channelId:
          type: integer
          format: int64
          example: 3
        channelName:
          type: string
          example: 네이버페이
        amount:
          type: integer
          example: 182000
        rate:
          type: number
          format: double
          description: 적용되었어야 할 할인/적립률
          example: 0.02
        benefitType:
          type: string
          enum: [DISCOUNT, POINT]
          example: DISCOUNT
        wouldHaveEarned:
          type: integer
          description: 업종 할인이 적용됐다면 받았을 금액(원)
          example: 2000
        approvedAt:
          type: string
          format: date-time

    # ===== 페이·정기결제 현황 (화면 4) =====

    ChannelUsageResponse:
      type: object
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        totalSpending:
          type: integer
          example: 1253800
        totalRecognized:
          type: integer
          description: 실적으로 인정된 합계(원)
          example: 961900
        totalLostBenefit:
          type: integer
          description: 업종 할인 미적용으로 놓친 혜택 합계(원)
          example: 13100
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelUsage'

    ChannelUsage:
      type: object
      description: 채널별 결제 현황 1건
      properties:
        channelId:
          type: integer
          format: int64
          example: 3
        channelName:
          type: string
          example: 네이버페이
        channelType:
          type: string
          enum: [PHYSICAL, MOBILE_PAY, ONLINE_PAY]
        amount:
          type: integer
          description: 기준월 해당 채널 결제액(원)
          example: 420000
        ratio:
          type: number
          format: double
          description: 전체 결제액 대비 비중 (0.0 ~ 1.0)
          example: 0.339
        transactionCount:
          type: integer
          example: 23
        mainCustomerCardId:
          type: integer
          format: int64
          nullable: true
          description: 이 채널에서 가장 많이 사용한 보유 카드
          example: 101
        mainCardName:
          type: string
          nullable: true
          example: PayMix 플래티넘
        performanceRate:
          type: number
          format: double
          description: 해당 카드 × 채널의 실적 인정률
          example: 1.0
        isBenefitEligible:
          type: boolean
          description: |
            false 이면 이 채널 결제에 업종별 할인·적립이 적용되지 않는다.
            간편결제 경유로 업종 판정이 불가능한 경우이며, 실적은 정상 반영된다.
          example: false
        recognizedAmount:
          type: integer
          description: 이 채널에서 인정된 실적(원)
          example: 420000
        lostBenefit:
          type: integer
          description: 업종 할인 미적용으로 받지 못한 혜택(원)
          example: 5376

    Subscription:
      type: object
      description: 정기결제 (subscriptions)
      properties:
        id:
          type: integer
          format: int64
          example: 501
        merchantName:
          type: string
          example: 넷플릭스
        categoryId:
          type: integer
          format: int64
          example: 9
        categoryName:
          type: string
          example: 구독
        amount:
          type: integer
          description: 회차당 결제 금액(원)
          example: 17000
        monthlyAmount:
          type: integer
          description: 월 환산 금액(원). YEARLY 는 12로 나눈 값
          example: 17000
        billingCycle:
          type: string
          enum: [MONTHLY, YEARLY]
          example: MONTHLY
        billingDay:
          type: integer
          nullable: true
          example: 15
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELED]
          example: ACTIVE
        customerCardId:
          type: integer
          format: int64
          description: 현재 결제되고 있는 보유 카드
          example: 102
        cardName:
          type: string
          example: PayMix 클래식
        isPerformanceRecognized:
          type: boolean
          description: 실적 인정 여부. false 면 실적 사각지대이며 제안 대상이 된다
          example: false
        recognizedAmount:
          type: integer
          description: 실제 인정되는 금액(원)
          example: 0
        deepLinkUrl:
          type: string
          nullable: true
          description: 결제수단 변경 페이지 딥링크. 자동 변경은 범위 밖
        startedAt:
          type: string
          format: date
          nullable: true

    SubscriptionUpdateRequest:
      type: object
      required: [customerCardId]
      properties:
        customerCardId:
          type: integer
          format: int64
          description: 변경할 보유 카드 ID. 고객이 보유한 자사 카드여야 한다
          example: 101
        status:
          type: string
          enum: [ACTIVE, PAUSED, CANCELED]

    # ===== 개선 제안 (화면 5) =====

    RecommendationCreateRequest:
      type: object
      properties:
        baseMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: 산출 기준월. 생략 시 직전 월
          example: '2026-08'
        includeSubscriptions:
          type: boolean
          description: 정기결제 이전 제안 포함 여부
          default: true

    Recommendation:
      type: object
      description: 제안 실행 이력 (recommendations)
      properties:
        id:
          type: integer
          format: int64
          example: 9001
        baseMonth:
          type: string
          example: '2026-08'
        status:
          type: string
          enum: [PENDING, ACCEPTED, DISMISSED, NO_CHANGE_NEEDED]
          description: |
            NO_CHANGE_NEEDED 는 현재 배치가 이미 최적인 경우다 (화면 5 예외 시나리오).
            이때 annualGain 은 0 이고 details 는 빈 배열이다.
          example: PENDING
        currentAnnualNetBenefit:
          type: integer
          description: 현재 배치 기준 연간 순이익(원)
          example: 361200
        optimizedAnnualNetBenefit:
          type: integer
          description: 최적 배치 기준 연간 순이익(원)
          example: 508800
        annualGain:
          type: integer
          description: 연간 개선액(원) = optimized − current. 0 이면 변경 실익 없음
          example: 147600
        explanation:
          type: string
          description: |
            확정된 수치를 설명하는 자연어 문장. 수치는 규칙 엔진이 산출하며 AI 는 설명만 생성한다.
          example: 네이버페이 결제를 플래티넘 카드로 옮기면 인정률이 50%에서 100%로 올라 다음 실적 구간에 도달합니다.
        calculatedAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        details:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationDetail'

    RecommendationDetail:
      type: object
      description: |
        제안 차분 상세 (recommendation_details).
        snapshot* 필드는 계산 시점의 규칙 값을 복사해 보관한 것으로,
        이후 혜택 규칙이 변경되어도 당시 제안 근거가 그대로 재현된다.
      properties:
        id:
          type: integer
          format: int64
          example: 7001
        detailType:
          type: string
          enum: [CHANNEL_REASSIGN, SUBSCRIPTION_MOVE, TIER_GAP]
          example: CHANNEL_REASSIGN
        channelId:
          type: integer
          format: int64
          nullable: true
          example: 3
        channelName:
          type: string
          nullable: true
          example: 네이버페이
        subscriptionId:
          type: integer
          format: int64
          nullable: true
        subscriptionName:
          type: string
          nullable: true
        currentCustomerCardId:
          type: integer
          format: int64
          nullable: true
          example: 102
        currentCardName:
          type: string
          nullable: true
          example: PayMix 클래식
        suggestedCustomerCardId:
          type: integer
          format: int64
          description: 권장 카드. 반드시 고객이 보유한 자사 카드다
          example: 101
        snapshotCardName:
          type: string
          description: 계산 시점 권장 카드명 (스냅샷)
          example: PayMix 플래티넘
        snapshotChannelRate:
          type: number
          format: double
          nullable: true
          description: 계산 시점 채널 인정률 (스냅샷)
          example: 1.0
        snapshotBenefitRate:
          type: number
          format: double
          nullable: true
          description: 계산 시점 적용 할인/적립률 (스냅샷)
          example: 0.1
        snapshotMonthlyLimit:
          type: integer
          nullable: true
          description: 계산 시점 적용 월 한도(원) (스냅샷)
          example: 20000
        currentMonthlyBenefit:
          type: integer
          description: 현재 배치의 월 혜택(원)
          example: 4200
        suggestedMonthlyBenefit:
          type: integer
          description: 권장 배치의 월 혜택(원)
          example: 16500
        monthlyGain:
          type: integer
          description: 월 개선액(원)
          example: 12300
        reason:
          type: string
          example: 네이버페이 인정률 100% 카드로 이동 시 인정실적 21만원 증가
        displayOrder:
          type: integer
          example: 1

    BenefitUtilizationResponse:
      type: object
      description: 카테고리별 혜택 활용도 분석 결과
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        totalCurrent:
          type: integer
          description: 현재 배치로 실제 받고 있는 카테고리 혜택 합계(원)
          example: 16320
        totalBest:
          type: integer
          description: 보유 카드를 최선으로 배치했을 때의 혜택 합계(원)
          example: 28790
        totalMissed:
          type: integer
          description: 놓치고 있는 혜택 합계(원) = totalBest − totalCurrent
          example: 12470
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryUtilization'

    CategoryUtilization:
      type: object
      description: 카테고리 1건의 혜택 활용 현황
      properties:
        categoryId:
          type: integer
          format: int64
          example: 2
        categoryName:
          type: string
          example: 쇼핑
        categoryCode:
          type: string
          example: SHOPPING
        amount:
          type: integer
          description: 기준월 해당 카테고리 결제액(원)
          example: 550000
        transactionCount:
          type: integer
          example: 5
        currentCardNames:
          type: array
          description: 현재 이 카테고리 결제에 사용 중인 카드들
          items:
            type: string
          example: [PayMix 플래티넘, PayMix 클래식]
        currentBenefit:
          type: integer
          description: 현재 배치로 받고 있는 혜택(원)
          example: 1620
        currentRate:
          type: number
          format: double
          description: 결제액 대비 실효 혜택률
          example: 0.0029
        bestOwned:
          $ref: '#/components/schemas/BenefitOption'
        ownedOptions:
          type: array
          description: 보유 카드별 예상 혜택 (혜택 큰 순)
          items:
            $ref: '#/components/schemas/BenefitOption'
        missedAmount:
          type: integer
          description: 놓치고 있는 금액(원) = bestOwned.benefit − currentBenefit
          example: 8380
        utilization:
          type: number
          format: double
          description: 활용도 (0.0 ~ 1.0) = currentBenefit / bestOwned.benefit
          example: 0.162
        catalogAlternative:
          allOf:
            - $ref: '#/components/schemas/BenefitOption'
          nullable: true
          description: |
            미보유 자사 카드 중 이 카테고리에서 더 유리한 상품 (참고용, 없으면 null).
            타사 카드는 포함하지 않는다.

    BenefitOption:
      type: object
      description: 특정 카드로 해당 카테고리를 결제했을 때의 예상 혜택
      properties:
        customerCardId:
          type: integer
          format: int64
          nullable: true
          description: 보유 카드인 경우의 ID. 미보유 카탈로그 상품이면 null
          example: 101
        cardId:
          type: integer
          format: int64
          example: 1
        cardCode:
          type: string
          example: PM-PLATINUM
        cardName:
          type: string
          example: PayMix 플래티넘
        tierName:
          type: string
          description: 적용 기준이 된 실적 구간
          example: 30만원 이상
        benefitType:
          type: string
          enum: [DISCOUNT, POINT]
          nullable: true
        rate:
          type: number
          format: double
          description: 해당 카테고리 할인/적립률
          example: 0.03
        benefit:
          type: integer
          description: 예상 월 혜택(원). 건당·항목월 한도 적용 후
          example: 10000
        monthlyItemLimit:
          type: integer
          nullable: true
          example: 15000
        capped:
          type: boolean
          description: 항목별 월 한도에 도달했는지 여부
          example: true
        annualFee:
          type: integer
          nullable: true
          description: 미보유 카탈로그 상품인 경우의 연회비(원)
          example: 50000

    CardSuggestionResponse:
      type: object
      description: 신규 카드 발급 추천 결과 (자사 카탈로그 한정)
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        baseAnnualNetBenefit:
          type: integer
          description: 보유 카드만으로 최적 배치했을 때의 연간 순이익(원). 비교 기준선
          example: 667272
        candidates:
          type: array
          description: 연회비 차감 후에도 순증이 발생하는 상품만 포함. 순증 큰 순
          items:
            $ref: '#/components/schemas/CardSuggestion'

    CardSuggestion:
      type: object
      properties:
        cardId:
          type: integer
          format: int64
          example: 5
        cardCode:
          type: string
          example: PM-DAILY
        cardName:
          type: string
          example: PayMix 데일리
        brand:
          type: string
          example: VISA
        description:
          type: string
          example: 카페·주유 특화 · 간편결제 업종 할인 그대로 적용
        annualFee:
          type: integer
          example: 20000
        totalMonthlyBenefitLimit:
          type: integer
          nullable: true
          example: 40000
        tierName:
          type: string
          description: 예상 도달 실적 구간
          example: 20만원 이상
        monthlyBenefit:
          type: integer
          description: 이 카드에 배치될 결제에서 예상되는 월 혜택(원)
          example: 12925
        annualBenefit:
          type: integer
          example: 155100
        annualGain:
          type: integer
          description: 연회비를 차감한 연간 순증(원). 양수인 경우에만 반환된다
          example: 94156
        breakEvenMonths:
          type: integer
          description: 연회비를 회수하는 데 걸리는 개월 수
          example: 2
        targetCategories:
          type: array
          description: 이 카드로 결제하면 좋은 소비 항목
          items:
            $ref: '#/components/schemas/SuggestionTarget'
        assignedChannels:
          type: array
          description: 이 카드를 물릴 결제 채널 (결제액 큰 순)
          items:
            type: object
            properties:
              channelId:
                type: integer
                format: int64
                example: 1
              channelName:
                type: string
                example: 실물카드
              amount:
                type: integer
                example: 170000
        reasons:
          type: array
          description: 추천 근거 — 혜택이 큰 카테고리 상위 3건
          items:
            $ref: '#/components/schemas/SuggestionReason'

    SuggestionTarget:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          example: 10
        categoryName:
          type: string
          example: 주유
        amount:
          type: integer
          description: 기준월 해당 항목 결제액(원)
          example: 170000
        count:
          type: integer
          example: 2
        channelNames:
          type: array
          description: 이 항목을 주로 결제한 채널 (결제액 큰 순)
          items:
            type: string
          example: [실물카드]

    SuggestionReason:
      type: object
      properties:
        categoryId:
          type: integer
          format: int64
          example: 4
        categoryName:
          type: string
          example: 카페
        rate:
          type: number
          format: double
          example: 0.15
        benefitType:
          type: string
          enum: [DISCOUNT, POINT]
          example: DISCOUNT
        spending:
          type: integer
          example: 43900
        benefit:
          type: integer
          description: 이 항목에서 예상되는 월 혜택(원)
          example: 6585

    TierGapAlert:
      type: object
      description: 실적 구간 근접 안내
      properties:
        customerCardId:
          type: integer
          format: int64
          example: 101
        cardName:
          type: string
          example: PayMix 플래티넘
        currentPerformance:
          type: integer
          example: 430000
        nextTierName:
          type: string
          example: 50만원 이상
        amountToNextTier:
          type: integer
          description: 상위 구간까지 남은 금액(원)
          example: 70000
        additionalMonthlyBenefit:
          type: integer
          description: 상위 구간 도달 시 추가되는 월 혜택(원)
          example: 9000
        daysLeft:
          type: integer
          description: 실적 산정 마감까지 남은 일수
          example: 12

    # ===== 카드사 대시보드 (화면 6) =====

    IssuerSummary:
      type: object
      description: 대시보드 요약 지표
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        totalCustomers:
          type: integer
          example: 12480
        activeCustomers:
          type: integer
          description: 기준월 결제 이력이 있는 고객 수
          example: 10233
        underPerformingCustomers:
          type: integer
          description: 실적 미달(tierLevel 0) 고객 수
          example: 4127
        underPerformingRatio:
          type: number
          format: double
          example: 0.403
        subscriptionHoldingRatio:
          type: number
          format: double
          description: 정기결제 보유 고객 비중
          example: 0.318
        totalSpending:
          type: integer
          format: int64
          description: 기준월 전체 결제액(원)
          example: 8420000000
        easyPaySpendingRatio:
          type: number
          format: double
          description: 간편결제 채널 결제 비중
          example: 0.519

    ChannelPositionResponse:
      type: object
      properties:
        baseMonth:
          type: string
          example: '2026-08'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/ChannelPosition'

    ChannelPosition:
      type: object
      description: 채널별 자사 카드 포지션
      properties:
        channelId:
          type: integer
          format: int64
          example: 3
        channelName:
          type: string
          example: 네이버페이
        channelType:
          type: string
          enum: [PHYSICAL, MOBILE_PAY, ONLINE_PAY]
        linkedCustomerCount:
          type: integer
          description: 해당 채널에 자사 카드를 연결한 고객 수
          example: 3820
        linkedRatio:
          type: number
          format: double
          description: 전체 고객 대비 연결 비중
          example: 0.306
        spending:
          type: integer
          format: int64
          description: 기준월 해당 채널 결제액(원)
          example: 1820000000
        avgPerformanceRate:
          type: number
          format: double
          description: 해당 채널에 적용 중인 자사 카드 평균 인정률
          example: 0.5
        underPerformingCustomerCount:
          type: integer
          description: 이 채널 사용 고객 중 실적 미달 인원
          example: 1640
        trend:
          type: array
          description: 최근 N개월 추이
          items:
            $ref: '#/components/schemas/ChannelTrendPoint'

    ChannelTrendPoint:
      type: object
      properties:
        month:
          type: string
          example: '2026-08'
        spending:
          type: integer
          format: int64
          example: 1820000000
        linkedRatio:
          type: number
          format: double
          example: 0.306

    # ===== 시뮬레이션 / 세그먼트 (화면 7) =====

    SimulationRequest:
      type: object
      description: |
        변경하려는 정책 파라미터. 기준월 실거래에 적용해 재계산하며 실제 정책은 변경되지 않는다.
        범위를 벗어난 값은 400 (화면 7 예외 시나리오).
      required: [cardId]
      properties:
        cardId:
          type: integer
          format: int64
          description: 시뮬레이션 대상 카드 상품
          example: 1
        baseMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-08'
        channelRates:
          type: array
          description: 변경할 채널 인정률
          items:
            type: object
            required: [channelId, performanceRate]
            properties:
              channelId:
                type: integer
                format: int64
                example: 3
              performanceRate:
                type: number
                format: double
                minimum: 0
                maximum: 1
                description: 0.0 ~ 1.0 범위를 벗어나면 400
                example: 1.0
        totalMonthlyBenefitLimit:
          type: integer
          minimum: 0
          nullable: true
          description: 변경할 카드 통합 월 한도(원)
          example: 60000
        tierAdjustments:
          type: array
          description: 변경할 실적 구간 기준
          items:
            type: object
            required: [tierLevel, minPerformance]
            properties:
              tierLevel:
                type: integer
                minimum: 0
                example: 1
              minPerformance:
                type: integer
                minimum: 0
                description: 구간 간 금액 경계가 역전되면 400
                example: 250000

    SimulationResponse:
      type: object
      description: 시뮬레이션 결과. 저장하지 않고 응답으로만 반환한다.
      properties:
        cardId:
          type: integer
          format: int64
          example: 1
        baseMonth:
          type: string
          example: '2026-08'
        before:
          $ref: '#/components/schemas/SimulationMetrics'
        after:
          $ref: '#/components/schemas/SimulationMetrics'
        deltaTierAchievedCustomers:
          type: integer
          description: 실적 충족 고객 수 변화(명)
          example: 1180
        deltaBenefitCost:
          type: integer
          format: int64
          description: 혜택 지급 비용 변화(원). 양수면 비용 증가
          example: 184000000
        deltaRecognizedPerformance:
          type: integer
          format: int64
          description: 인정실적 총액 변화(원)
          example: 920000000
        affectedCustomerCount:
          type: integer
          description: 영향을 받는 고객 수
          example: 3820

    SimulationMetrics:
      type: object
      properties:
        tierAchievedCustomers:
          type: integer
          description: 실적 구간 충족 고객 수
          example: 6106
        tierAchievedRatio:
          type: number
          format: double
          example: 0.597
        benefitCost:
          type: integer
          format: int64
          description: 혜택 지급 비용(원)
          example: 412000000
        recognizedPerformance:
          type: integer
          format: int64
          description: 인정실적 총액(원)
          example: 4310000000

    SegmentRequest:
      type: object
      description: 세그먼트 추출 조건. 결과는 저장하지 않는다.
      properties:
        cardId:
          type: integer
          format: int64
          example: 1
        baseMonth:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          example: '2026-08'
        channelId:
          type: integer
          format: int64
          description: 해당 채널 사용 고객으로 한정
          example: 3
        tierLevel:
          type: integer
          minimum: 0
          description: 특정 실적 구간 고객으로 한정
          example: 0
        hasSubscription:
          type: boolean
          description: 정기결제 보유 여부
        minSpending:
          type: integer
          minimum: 0
          description: 기준월 최소 결제액(원)
          example: 300000

    SegmentResponse:
      type: object
      properties:
        customerCount:
          type: integer
          description: 조건에 해당하는 고객 수
          example: 1640
        avgRecognizedPerformance:
          type: integer
          description: 평균 인정실적(원)
          example: 218000
        avgGapToNextTier:
          type: integer
          description: 상위 구간까지 평균 부족액(원)
          example: 82000
        customers:
          type: array
          description: 상위 미리보기 목록 (최대 100건)
          items:
            $ref: '#/components/schemas/SegmentCustomer'

    SegmentCustomer:
      type: object
      properties:
        customerId:
          type: integer
          format: int64
          example: 3021
        name:
          type: string
          example: 박수빈
        recognizedPerformance:
          type: integer
          example: 218000
        tierLevel:
          type: integer
          example: 0
        gapToNextTier:
          type: integer
          example: 82000
        mainChannelName:
          type: string
          example: 네이버페이

    # ===== 외부 시스템 연동 =====

    TransactionIngestRequest:
      type: object
      description: 결제 승인계가 송신하는 거래 묶음
      required: [transactions]
      properties:
        transactions:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TransactionItem'

    TransactionItem:
      type: object
      description: 거래 1건 (transactions)
      required: [externalTxId, maskedNumber, channelCode, merchantName, amount, approvedAt]
      properties:
        externalTxId:
          type: string
          maxLength: 64
          description: 승인계 원 거래 ID. 멱등성 키로 사용되며 중복 수신 시 무시된다
          example: TX-20260815-0001923
        maskedNumber:
          type: string
          description: 마스킹 카드번호. 보유 카드 식별에 사용
          example: 1234-****-****-5678
        channelCode:
          type: string
          description: 결제 채널 코드
          example: NAVER_PAY
        merchantName:
          type: string
          maxLength: 200
          description: 원본 가맹점명. 간편결제·PG 경유 시 식별이 어려운 형태로 들어온다
          example: (주)네이버파이낸셜_스타벅스코리아
        amount:
          type: integer
          minimum: 0
          example: 6500
        approvedAt:
          type: string
          format: date-time
          example: '2026-08-15T12:31:04'
        status:
          type: string
          enum: [APPROVED, CANCELED]
          default: APPROVED

    TransactionIngestResult:
      type: object
      properties:
        receivedCount:
          type: integer
          description: 수신 건수
          example: 120
        savedCount:
          type: integer
          description: 신규 저장 건수
          example: 118
        duplicatedCount:
          type: integer
          description: externalTxId 중복으로 무시된 건수
          example: 2
        normalizationFailedCount:
          type: integer
          description: 업종 정규화 실패 건수. 저장되지만 혜택 산출에서 제외된다
          example: 3
